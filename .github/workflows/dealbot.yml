name: Deal Falcon

on:
  schedule:
    # Every 6 hours (4 sweeps a day), at 17 minutes past the hour because
    # GitHub delays jobs that start exactly on the hour.
    # UAE times: 4:17, 10:17, 16:17, 22:17
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# never let two sweeps run at once
concurrency:
  group: deal-falcon-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Hunt for deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          SCRAPEDO_KEY: ${{ secrets.SCRAPEDO_KEY }}
          SCRAPINGANT_KEY: ${{ secrets.SCRAPINGANT_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
        run: python deal_bot.py

      - name: Save settings and deal memory
        run: |
          git config user.name "deal-falcon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json || true
          git commit -m "Update state" || echo "Nothing to save"
          git pull --rebase --autostash || true
          git push || echo "Push skipped"

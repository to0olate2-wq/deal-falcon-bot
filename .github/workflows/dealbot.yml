name: Deal Falcon

on:
  schedule:
    # Runs at 9am, 3pm and 9pm UAE time (times below are UTC).
    # Want more checks per day? Add more hours, e.g. "0 5,8,11,14,17 * * *"
    - cron: "0 5,11,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Hunt for deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python deal_bot.py

      - name: Remember alerted deals
        run: |
          git config user.name "deal-falcon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Update deal memory" || echo "Nothing new to remember"
          git push || echo "Push skipped"
